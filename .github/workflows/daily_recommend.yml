name: Daily Recommendation

on:
  workflow_dispatch:  # cron-job.org 가 매일 22:00 KST 정확 trigger
                      # schedule 라인 제거 — GitHub Actions free tier 지연 (~3h)
                      # 으로 새벽 발동 noise 발생 (2026-06-04 fix)

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 키워드 트리맵이 daily_recommend 로 옮겨오면서 폰트 의존성이 따라오지 않아
      # 한글이 전부 네모로 깨졌다(2026-08-26). daily_quant.yml 과 동일한 단계.
      - name: Install Korean fonts (키워드 트리맵 한글 라벨 — 없으면 네모로 깨짐)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f >/dev/null 2>&1 || true
          python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)" || true

      - name: Run daily recommendation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_REC_PARENT_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
        run: python daily_recommend.py
