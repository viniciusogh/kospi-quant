name: Daily Momentum Report

on:
  schedule:
    - cron: '35 8 * * 1-5'   # 17:35 KST (UTC+9), 평일. 수급(17:30) 직후
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-momentum
  cancel-in-progress: false

jobs:
  run-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily momentum report
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python momentum_daily.py

      - name: Commit latest momentum reco CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_momentum_reco.csv momentum_history.csv momentum_analysis.json
          git diff --staged --quiet || git commit -m "Auto-update: momentum reco $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
