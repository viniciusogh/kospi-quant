name: Daily Momentum Report

on:
  # 정기 실행은 daily_quant.yml 에 통합(수급.py 직후 momentum_daily.py 실행) — 2026-06-15.
  # 네이티브 schedule 은 누락 잦아 제거. 이 워크플로는 수동 단독 실행(백업)용으로만 유지.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-momentum
  cancel-in-progress: false

jobs:
  run-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily momentum report
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python momentum_daily.py

      - name: Run momentum report (20%컷·추세게이트 변형 — 별도 Notion 페이지)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOM_CUT: "0.20"
          MOM_GATE: "1"
          MOM_LABEL: " (20%컷·추세게이트)"
          MOM_TAG: "_v20g"
        run: python momentum_daily.py
        continue-on-error: true

      - name: Commit latest momentum reco CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_momentum_reco.csv momentum_history.csv momentum_analysis.json 2>/dev/null || true
          git add latest_momentum_reco_v20g.csv momentum_history_v20g.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update: momentum reco $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
