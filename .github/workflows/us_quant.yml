name: Daily US Quant Analysis

on:
  # 2026-08-17 자동실행 중단 — 사용자가 US 추천종목 리포트를 보지 않음(토큰·노션 낭비).
  # 산출물(us_score_history.csv)을 참조하는 다른 스크립트가 없어 완전 중단 가능.
  # 되살리려면 아래 schedule 주석을 풀면 된다.
  # schedule:
  #   - cron: '0 22 * * *'   # 07:00 KST (UTC+9), 매일 - 미국 장 마감 후
  workflow_dispatch:         # 수동 실행만 유지

permissions:
  contents: write

jobs:
  run-us-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore US financial cache
        uses: actions/cache@v4
        with:
          path: us_fin_cache.csv
          key: us-fin-${{ github.run_id }}
          restore-keys: |
            us-fin-

      - name: Run US quant analysis
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUTPUT_DIR: ${{ github.workspace }}
        run: python us_quant.py

      - name: Commit US score history CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_score_history.csv
          git diff --staged --quiet || git commit -m "Auto-update: us_score_history.csv $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
