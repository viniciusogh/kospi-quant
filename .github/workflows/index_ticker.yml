name: Index Ticker (hourly)

on:
  # 주 트리거: cron-job.org 가 매시 정각 workflow_dispatch (네이티브 schedule 지연/누락 회피 — daily_quant 와 동일 패턴).
  # 네이티브 schedule 은 cron-job.org 장애 시 백업용으로만 유지.
  schedule:
    - cron: '0 * * * *'   # 매시 정각 백업 (UTC=KST-9). 한국장·미국장·FX 커버
  workflow_dispatch:      # ← cron-job.org 가 매시 trigger
    inputs:
      restore:
        description: '복구할 페이지 ID(쉼표구분). 비우면 평소 갱신.'
        required: false
        default: ''

permissions:
  contents: read           # Notion 파일업로드만 — git commit 안 함(충돌·노이즈 회피)

concurrency:
  group: index-ticker
  cancel-in-progress: false

jobs:
  ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run index ticker
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          INDEX_RESTORE: ${{ github.event.inputs.restore }}
        run: python index_ticker.py
