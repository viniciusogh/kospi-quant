name: Daily YouTube Analysis

on:
  schedule:
    - cron: '0 8-15 * * *'  # 17:00~00:00 KST (UTC+9), 매시간
  workflow_dispatch:         # 수동 실행 가능

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install yt-dlp (RSS 우회용, /usr/local/bin 으로 설치)
        run: pip install --upgrade yt-dlp

      - name: Write YouTube cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube_cookies.txt
          fi

      - name: Run YouTube analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python youtube_report.py

      - name: Commit state files (daily_recommend 가 의존)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_youtube_analysis.json notion_daily_pages.json processed_videos.json
          git diff --staged --quiet || git commit -m "Auto-update: youtube state $(date +%Y-%m-%d_%H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
