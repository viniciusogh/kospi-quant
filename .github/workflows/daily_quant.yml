name: Daily Quant Analysis

on:
  schedule:
    - cron: '30 8 * * 1-5'  # 17:30 KST (UTC+9), 평일만 (backup)
  workflow_dispatch:          # cron-job.org 가 매일 16:45 KST trigger

permissions:
  contents: write

# 동시 실행 차단 — schedule + workflow_dispatch race 방지 (2026-05-22 conflict 이슈)
concurrency:
  group: daily-quant
  cancel-in-progress: false   # 큐 대기 (이미 도는 거 끝날 때까지)

jobs:
  run-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore financial ratio cache
        uses: actions/cache@v4
        with:
          path: fin_ratio_cache.csv
          key: fin-ratio-${{ github.run_id }}
          restore-keys: |
            fin-ratio-

      - name: Run KOSPI quant analysis
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUTPUT_DIR: ${{ github.workspace }}
          SKIP_NOTION_REPORT: "1"   # 노션 리포트 폐지(사용자 미열람) — CSV 는 모멘텀이 사용하므로 계속 생성
        run: python 수급.py

      - name: Install Korean fonts (트리맵 한글 라벨 — 없으면 네모로 깨짐)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f >/dev/null 2>&1 || true
          python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)" || true

      - name: Run sector rotation dashboard (수급.py 산출 latest_kospi_supply.csv 사용)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python sector_dashboard.py
        continue-on-error: true   # 섹터 대시보드 실패해도 모멘텀·커밋은 진행

      - name: Run KOSPI Quality analysis (별도 모델, fin_ratio_cache 공유)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          OUTPUT_DIR: ${{ github.workspace }}
          SKIP_NOTION_REPORT: "1"   # 노션 리포트 폐지 — latest_kospi_quality.csv 는 모멘텀 부채순위에 필요
        run: python quality.py

      - name: Run intersection (수급 × Quality 교집합)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          SKIP_NOTION_REPORT: "1"   # 노션 리포트 폐지
        run: python intersection.py
        continue-on-error: true   # 교집합 없을 때도 워크플로 종료 안 됨

      - name: Run daily momentum report (수급.py 산출 latest_kospi_supply.csv 재사용 — 통합 2026-06-15)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOM_TARGET: "dashboard"   # 날짜별 원본 페이지 대신 통합 대시보드 토글로 (2026-08-17)
        run: python momentum_daily.py
        continue-on-error: true   # 모멘텀 실패해도 나머지 커밋 진행

      - name: Run momentum report (20%컷·추세게이트 변형 — 별도 Notion 페이지)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_DAILY_DB_ID: ${{ secrets.NOTION_DAILY_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOM_CUT: "0.20"
          MOM_GATE: "1"
          MOM_LABEL: " (20%컷·추세게이트)"
          MOM_TAG: "_v20g"
          MOM_TARGET: "dashboard"
        run: python momentum_daily.py
        continue-on-error: true

      # 검증 게이트 — 깨진 산출물은 커밋 전에 차단한다 (2026-08-29).
      # 위 스텝 다수가 continue-on-error 라 실패가 초록불에 묻혔다: 자막 5일 0개·NameError
      # 8일 정지가 며칠 뒤 대시보드 경고로야 발견됐다. 스텝 성공여부가 아니라 산출물로 판정한다
      # — 성공하고도 쓰레기를 내놓는 게 무음 실패의 본질이다.
      # 여기서 죽으면 아래 커밋 스텝 전부 skip → 하위 소비자(investment-chatbot)는 어제 데이터
      # 를 유지한다. 낡은 데이터가 깨진 데이터보다 안전하다.
      - name: 산출물 검증 게이트 (수급·퀄리티)
        if: always()
        run: python sanity_check.py supply quality

      - name: Commit latest KOSPI supply CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_kospi_supply.csv
          git diff --staged --quiet || git commit -m "Auto-update: latest_kospi_supply.csv $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

      - name: Commit KOSPI score history CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kospi_score_history.csv
          git diff --staged --quiet || git commit -m "Auto-update: kospi_score_history.csv $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

      - name: Commit Quality score history + latest CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quality_score_history.csv latest_kospi_quality.csv
          git diff --staged --quiet || git commit -m "Auto-update: quality results $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

      - name: Commit reco CSVs (수급 ∩ Quality TOP100 - vault ETL 용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_수급_reco.csv latest_quality_reco.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update: reco CSVs $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

      # 모멘텀은 수급 CSV 파생이라 위 게이트 통과가 전제다. 별도 게이트로 두어 모멘텀만
      # 깨진 날에도 수급·퀄리티 커밋은 이미 끝나 있게 한다.
      - name: 산출물 검증 게이트 (모멘텀)
        run: python sanity_check.py momentum

      - name: Commit momentum reco CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_momentum_reco.csv momentum_history.csv momentum_analysis.json 2>/dev/null || true
          git add latest_momentum_reco_v20g.csv momentum_history_v20g.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update: momentum reco $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done

      - name: Upload Excel reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-report-${{ github.run_id }}
          path: |
            *_국내퀀트데이터.xlsx
            *_KOSPI_Quality퀀트데이터.xlsx
          retention-days: 30
